# À coller dans Container Manager → Projet → Créer (voir docs/MISE-EN-LIGNE.md).
# Au démarrage : clone ou met à jour le dépôt GitHub, installe et lance le serveur.
# Pour déployer une nouvelle version : pousser sur GitHub, puis redémarrer le projet.
# Si la nouvelle version échoue aux tests (npm test), l'ancienne est remise et démarre à sa place.
# Le chrono en cours et les séances pas encore envoyées à Notion sont gardés dans /docker/bosse/app/data (jamais envoyés sur GitHub).
services:
  bosse:
    image: node:20-alpine
    container_name: bosse
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      - PORT=3015
      - TZ=Europe/Paris
      # OBLIGATOIRE : mot de passe demandé une fois sur chaque téléphone.
      # Vide = l'appli refuse d'écouter sur le réseau (elle sera injoignable).
      - APP_PASSWORD=
      # Le même jeton que Repax, Agendix, Argenx et Brief (vide = mode démo : données fictives, rien n'est lu ni écrit dans Notion).
      - NOTION_TOKEN=
      # Identifiant de la BASE « Mes projets » (pas celui de la source de données « collection://… »).
      # Les bases « Tâches », « Sessions de travail » et « Musique » sont retrouvées par leur titre dans la même page (« Projet »).
      - NOTION_BASE_PROJETS=d5d82250-5a73-4f9b-a4f0-679c73ad9d75
      # Facultatif : identifiants de ces bases, si on ne veut pas les chercher par leur titre.
      # - NOTION_BASE_TACHES=77f8a7d3-8bdd-4652-8f5d-bb9b999da190
      # - NOTION_BASE_SESSIONS=9bdd49bb-b595-41e0-b796-c6031688ce76
      # - NOTION_BASE_MUSIQUE=0e611578-86d3-411b-9cf5-61b2c28b7bd6
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "apk add --no-cache git &&
             git config --global --add safe.directory /app &&
             if [ -d /app/.git ]; then
               AVANT=$$(git rev-parse HEAD);
               git fetch --depth 1 origin main && git reset --hard FETCH_HEAD;
               if ! (npm ci --omit=dev && NOTION_TOKEN= npm test); then
                 echo 'Nouvelle version en echec aux tests : retour a la precedente';
                 git reset --hard $$AVANT && npm ci --omit=dev;
               fi;
             else
               git clone --depth 1 https://github.com/Kaloomc/Bosse.git /app && npm ci --omit=dev;
             fi &&
             npm start"
